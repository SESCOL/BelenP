<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unidad Belén — Control de Estacionamiento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --accent: #c8f135;
    --accent-dim: #9db82a;
    --text: #f0f0f0;
    --text-muted: #7a7a8c;
    --red: #ff4f4f;
    --green: #4fffb0;
    --yellow: #ffd166;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
  }

  .logo span { color: var(--text-muted); font-weight: 400; font-size: 0.8rem; margin-left: 8px; letter-spacing: 0.04em; }

  /* ── Nav tabs ── */
  nav {
    display: flex;
    gap: 4px;
    padding: 16px 28px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .tab {
    padding: 9px 20px;
    border-radius: var(--radius) var(--radius) 0 0;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
    letter-spacing: 0.02em;
  }

  .tab:hover { color: var(--text); background: var(--surface2); }
  .tab.active { background: var(--bg); color: var(--accent); border-top: 2px solid var(--accent); }

  /* ── Main layout ── */
  main { flex: 1; padding: 28px; max-width: 900px; width: 100%; margin: 0 auto; }

  .page { display: none; }
  .page.active { display: block; }

  /* ── Section titles ── */
  .section-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 20px;
  }

  /* ── Forms ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    font-weight: 500;
  }

  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.92rem;
    padding: 10px 13px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-muted); }
  input.plate-input { font-family: 'Space Mono', monospace; font-size: 1.2rem; letter-spacing: 0.18em; text-transform: uppercase; }

  .btn {
    padding: 10px 20px;
    border-radius: 7px;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.03em;
  }

  .btn:active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); color: #111; }
  .btn-accent:hover { opacity: 0.88; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }
  .btn-danger { background: transparent; border: 1px solid #ff4f4f44; color: var(--red); }
  .btn-danger:hover { background: #ff4f4f18; }
  .btn-full { width: 100%; padding: 12px; font-size: 0.95rem; }

  /* ── Residents list ── */
  .resident-list { display: flex; flex-direction: column; gap: 10px; }

  .resident-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s;
  }

  .resident-card:hover { border-color: var(--accent); }

  .plate-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 11px;
    color: var(--accent);
    min-width: 110px;
    text-align: center;
    flex-shrink: 0;
  }

  .resident-info { flex: 1; }
  .resident-name { font-weight: 600; font-size: 0.95rem; }
  .resident-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }

  .resident-actions { display: flex; gap: 8px; }

  /* ── Verify page ── */
  .verify-big {
    text-align: center;
    padding: 32px 0 24px;
  }

  .verify-big input {
    font-family: 'Space Mono', monospace;
    font-size: 2.2rem;
    letter-spacing: 0.22em;
    text-align: center;
    text-transform: uppercase;
    max-width: 360px;
    margin: 0 auto 20px;
    display: block;
    padding: 18px 20px;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--yellow);
  }

  .verify-big input:focus { border-color: var(--accent); }

  /* ── Result box ── */
  .result-box {
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-top: 20px;
    display: none;
    animation: fadeIn 0.25s ease;
  }

  .result-box.show { display: block; }
  .result-box.ok { background: #0d2b1e; border: 1.5px solid var(--green); }
  .result-box.fail { background: #2b0d0d; border: 1.5px solid var(--red); }

  .result-status {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .ok .status-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .fail .status-dot { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .ok .result-status { color: var(--green); }
  .fail .result-status { color: var(--red); }

  .result-name { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
  .result-detail { font-size: 0.85rem; color: var(--text-muted); }

  /* ── Log ── */
  .log-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }

  .log-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--surface2);
    border-radius: 7px;
    font-size: 0.83rem;
  }

  .log-plate {
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    min-width: 95px;
  }

  .log-name { flex: 1; color: var(--text); }
  .log-time { color: var(--text-muted); font-size: 0.78rem; }
  .log-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .log-badge.ok { background: #0d2b1e; color: var(--green); }
  .log-badge.fail { background: #2b0d0d; color: var(--red); }

  /* ── Camera area ── */
  .camera-section {
    background: var(--surface2);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
  }

  #video-preview {
    width: 100%;
    max-width: 420px;
    border-radius: 8px;
    display: none;
    margin: 12px auto 0;
  }

  #canvas-snap { display: none; }

  #snap-preview {
    width: 100%;
    max-width: 420px;
    border-radius: 8px;
    display: none;
    margin: 12px auto 0;
    border: 2px solid var(--accent);
  }

  .camera-controls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

  .ocr-result {
    margin-top: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-align: center;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 0.88rem;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: #000a;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
    animation: fadeIn 0.2s ease;
  }

  .modal-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

  /* ── Regime bar ── */
  #regime-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
  }

  .regime-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.2s;
  }

  .regime-title:hover { color: var(--text); }
  .regime-title.active { color: var(--accent); }

  .regime-sep {
    color: var(--border);
    font-size: 0.9rem;
    line-height: 1;
  }

  /* ── Active regime indicator ── */
  #regime-indicator {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    background: #c8f13518;
    border: 1px solid #c8f13530;
    border-radius: 5px;
    padding: 3px 10px;
    margin-bottom: 14px;
    display: inline-block;
  }



  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 18px;
    font-size: 0.88rem;
    color: var(--text);
    display: none;
    z-index: 200;
    animation: fadeIn 0.2s ease;
    max-width: 280px;
  }

  /* ── Stats bar ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }

  .stat-val {
    font-family: 'Space Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; letter-spacing: 0.04em; }

  /* ── Search ── */
  .search-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .search-row input { flex: 1; }

  @media (max-width: 600px) {
    header { padding: 14px 18px; }
    nav { padding: 12px 18px 0; }
    main { padding: 18px; }
    .form-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .verify-big input { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">UNIDAD BELÉN</div>
  <div style="font-size:0.78rem; color:var(--text-muted); text-align:right" id="clock"></div>
</header>

<nav>
  <button class="tab active" onclick="switchTab('verify')">🚗 Placa</button>
  <button class="tab" onclick="switchTab('residents')">👥 Residentes</button>
</nav>

<main>

  <!-- ══ VERIFY PAGE ══ -->
  <div class="page active" id="page-verify">
    <div id="regime-indicator">RÉGIMEN 1, 2, 3</div>

    <div class="camera-section">
      <p class="section-title">📷 Escanear placa con cámara</p>
      <video id="video-preview" autoplay playsinline></video>
      <canvas id="canvas-snap"></canvas>
      <img id="snap-preview" alt="Foto de placa">
      <div class="ocr-result" id="ocr-result"></div>
      <div class="camera-controls">
        <button class="btn btn-ghost" id="btn-start-cam" onclick="startCamera()">Abrir cámara</button>
        <button class="btn btn-accent" id="btn-snap" onclick="snapPhoto()" style="display:none">Tomar foto</button>
        <button class="btn btn-ghost" id="btn-retake" onclick="retakePhoto()" style="display:none">Repetir</button>
        <button class="btn btn-ghost" id="btn-stop-cam" onclick="stopCamera()" style="display:none">Cerrar</button>
      </div>
      <p style="font-size:0.76rem; color:var(--text-muted); margin-top:10px">La placa detectada se cargará automáticamente abajo</p>
    </div>

    <div class="verify-big">
      <p class="section-title">O ingresa la placa manualmente</p>
      <input type="text" id="verify-input" class="plate-input" placeholder="ABC-123" maxlength="10"
        oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')checkPlate()">
      <button class="btn btn-accent btn-full" style="max-width:360px;margin:0 auto" onclick="checkPlate()">Verificar placa</button>
      <div class="result-box" id="result-box">
        <div class="result-status"><span class="status-dot"></span><span id="result-status-text"></span></div>
        <div class="result-name" id="result-name"></div>
        <div class="result-detail" id="result-detail"></div>
      </div>
    </div>

  </div>

  <!-- ══ RESIDENTS PAGE ══ -->
  <div class="page" id="page-residents">

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="stat-total">0</div>
        <div class="stat-label">Residentes registrados</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-plates">0</div>
        <div class="stat-label">Placas válidas</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-checks">0</div>
        <div class="stat-label">Verificaciones hoy</div>
      </div>
    </div>

    <div class="search-row">
      <input type="text" id="search-input" placeholder="Buscar por nombre, placa o departamento…" oninput="renderResidents()">
      <button class="btn btn-accent" onclick="openAddModal()">+ Agregar</button>
    </div>

    <div class="resident-list" id="resident-list"></div>

  </div>

  <!-- ══ LOG PAGE ══ -->
  <div class="page" id="page-log">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
      <p class="section-title" style="margin:0">Registro de accesos</p>
      <button class="btn btn-ghost" style="font-size:0.8rem" onclick="clearLog()">Limpiar</button>
    </div>
    <div class="log-list" id="log-list">
      <div class="empty">Sin registros aún.</div>
    </div>
  </div>

</main>

<!-- ══ ADD/EDIT MODAL ══ -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <p class="modal-title" id="modal-title">Nuevo residente</p>
    <div class="form-grid">
      <div class="form-group full">
        <label>Placa(s) — separar con coma si tiene más de una</label>
        <input type="text" id="f-plates" placeholder="ABC-123, XYZ-789" style="text-transform:uppercase">
      </div>
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="f-name" placeholder="Juan Pérez">
      </div>
      <div class="form-group">
        <label>Departamento / Unidad</label>
        <input type="text" id="f-dept" placeholder="Depto 4B">
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="f-phone" placeholder="55 1234 5678">
      </div>
      <div class="form-group">
        <label>Notas (opcional)</label>
        <input type="text" id="f-notes" placeholder="Visitante frecuente…">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-accent" onclick="saveResident()">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────
let residents = JSON.parse(localStorage.getItem('parq_residents') || '[]');
let accessLog = JSON.parse(localStorage.getItem('parq_log') || '[]');
let editingId = null;
let stream = null;
let todayChecks = 0;

// ── Clock ──────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString('es-MX', {weekday:'short', day:'numeric', month:'short'}) + ' · ' +
    now.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// ── Tab switching ──────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'residents') { renderResidents(); updateStats(); }
  if (name === 'log') renderLog();
}

// ── Save ───────────────────────────────────────────────
function saveData() {
  localStorage.setItem('parq_residents', JSON.stringify(residents));
  localStorage.setItem('parq_log', JSON.stringify(accessLog));
}

// ── Normalize plate ────────────────────────────────────
function normPlate(p) { return p.trim().toUpperCase().replace(/[\s\-\.]/g, ''); }

// ── Lookup plate ───────────────────────────────────────
function findResident(plate) {
  const n = normPlate(plate);
  return residents.find(r =>
    r.plates.map(normPlate).includes(n)
  ) || null;
}

// ── Verify ─────────────────────────────────────────────
function checkPlate() {
  const raw = document.getElementById('verify-input').value.trim();
  if (!raw) return;

  const resident = findResident(raw);
  const box = document.getElementById('result-box');
  box.className = 'result-box show ' + (resident ? 'ok' : 'fail');
  document.getElementById('result-status-text').textContent = resident ? 'ACCESO PERMITIDO' : 'PLACA NO REGISTRADA';
  document.getElementById('result-name').textContent = resident ? resident.name : normPlate(raw);
  document.getElementById('result-detail').textContent = resident
    ? `${resident.dept} · ${resident.phone}${resident.notes ? ' · ' + resident.notes : ''}`
    : 'Esta placa no está en el catálogo de residentes.';

  // Log
  const entry = {
    plate: normPlate(raw),
    name: resident ? resident.name : '—',
    dept: resident ? resident.dept : '—',
    ok: !!resident,
    time: new Date().toISOString()
  };
  accessLog.unshift(entry);
  if (accessLog.length > 200) accessLog.pop();
  todayChecks++;
  document.getElementById('stat-checks').textContent = todayChecks;
  saveData();
}

// ── Residents render ───────────────────────────────────
function renderResidents() {
  const q = (document.getElementById('search-input').value || '').toLowerCase();
  const list = document.getElementById('resident-list');
  const filtered = residents.filter(r =>
    !q ||
    r.name.toLowerCase().includes(q) ||
    r.dept.toLowerCase().includes(q) ||
    r.plates.some(p => p.toLowerCase().includes(q))
  );

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Sin resultados.</div>';
    return;
  }

  list.innerHTML = filtered.map(r => `
    <div class="resident-card">
      <div>
        ${r.plates.map(p => `<div class="plate-badge">${p.toUpperCase()}</div>`).join('<br>')}
      </div>
      <div class="resident-info">
        <div class="resident-name">${r.name}</div>
        <div class="resident-meta">${r.dept} · ${r.phone}${r.notes ? ' · ' + r.notes : ''}</div>
      </div>
      <div class="resident-actions">
        <button class="btn btn-ghost" style="padding:7px 12px;font-size:0.8rem" onclick="editResident('${r.id}')">Editar</button>
        <button class="btn btn-danger" style="padding:7px 12px;font-size:0.8rem" onclick="deleteResident('${r.id}')">Borrar</button>
      </div>
    </div>
  `).join('');
}

function updateStats() {
  document.getElementById('stat-total').textContent = residents.length;
  const plates = residents.reduce((a, r) => a + r.plates.length, 0);
  document.getElementById('stat-plates').textContent = plates;
}

// ── Modal ──────────────────────────────────────────────
function openAddModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Nuevo residente';
  ['f-plates','f-name','f-dept','f-phone','f-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('modal').classList.add('show');
}

function editResident(id) {
  const r = residents.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Editar residente';
  document.getElementById('f-plates').value = r.plates.join(', ');
  document.getElementById('f-name').value = r.name;
  document.getElementById('f-dept').value = r.dept;
  document.getElementById('f-phone').value = r.phone;
  document.getElementById('f-notes').value = r.notes || '';
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function saveResident() {
  const plates = document.getElementById('f-plates').value.split(',').map(p => p.trim().toUpperCase()).filter(Boolean);
  const name = document.getElementById('f-name').value.trim();
  const dept = document.getElementById('f-dept').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const notes = document.getElementById('f-notes').value.trim();

  if (!plates.length || !name || !dept || !phone) {
    showToast('⚠️ Completa placa, nombre, departamento y teléfono.');
    return;
  }

  if (editingId) {
    const idx = residents.findIndex(r => r.id === editingId);
    residents[idx] = { ...residents[idx], plates, name, dept, phone, notes };
    showToast('✅ Residente actualizado.');
  } else {
    residents.push({ id: Date.now().toString(), plates, name, dept, phone, notes });
    showToast('✅ Residente agregado.');
  }

  saveData();
  closeModal();
  renderResidents();
  updateStats();
}

function deleteResident(id) {
  if (!confirm('¿Eliminar este residente?')) return;
  residents = residents.filter(r => r.id !== id);
  saveData();
  renderResidents();
  updateStats();
  showToast('🗑️ Residente eliminado.');
}

// ── Log render ─────────────────────────────────────────
function renderLog() {
  const list = document.getElementById('log-list');
  if (!accessLog.length) {
    list.innerHTML = '<div class="empty">Sin registros aún.</div>';
    return;
  }
  list.innerHTML = accessLog.map(e => {
    const d = new Date(e.time);
    const time = d.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}) + ' ' +
                 d.toLocaleDateString('es-MX', {day:'numeric', month:'short'});
    return `
      <div class="log-item">
        <span class="log-plate">${e.plate}</span>
        <span class="log-name">${e.name}${e.dept !== '—' ? ' <span style="color:var(--text-muted)">· '+e.dept+'</span>' : ''}</span>
        <span class="log-time">${time}</span>
        <span class="log-badge ${e.ok ? 'ok' : 'fail'}">${e.ok ? 'OK' : 'NO'}</span>
      </div>
    `;
  }).join('');
}

function clearLog() {
  if (!confirm('¿Borrar todo el historial?')) return;
  accessLog = [];
  saveData();
  renderLog();
}

// ── Toast ──────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 3000);
}

// ── Camera ─────────────────────────────────────────────
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('video-preview');
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('btn-start-cam').style.display = 'none';
    document.getElementById('btn-snap').style.display = 'inline-block';
    document.getElementById('btn-stop-cam').style.display = 'inline-block';
    document.getElementById('snap-preview').style.display = 'none';
    document.getElementById('ocr-result').textContent = '';
  } catch(e) {
    showToast('📵 No se pudo acceder a la cámara.');
  }
}

function snapPhoto() {
  const video = document.getElementById('video-preview');
  const canvas = document.getElementById('canvas-snap');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  const img = document.getElementById('snap-preview');
  img.src = canvas.toDataURL('image/jpeg');
  img.style.display = 'block';
  video.style.display = 'none';
  document.getElementById('btn-snap').style.display = 'none';
  document.getElementById('btn-retake').style.display = 'inline-block';
  document.getElementById('ocr-result').textContent = '⏳ Analizando placa…';

  // Send to Claude API for plate reading
  readPlateWithAI(canvas.toDataURL('image/jpeg'));
}

function retakePhoto() {
  const video = document.getElementById('video-preview');
  video.style.display = 'block';
  document.getElementById('snap-preview').style.display = 'none';
  document.getElementById('btn-snap').style.display = 'inline-block';
  document.getElementById('btn-retake').style.display = 'none';
  document.getElementById('ocr-result').textContent = '';
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('video-preview').style.display = 'none';
  document.getElementById('snap-preview').style.display = 'none';
  document.getElementById('btn-start-cam').style.display = 'inline-block';
  document.getElementById('btn-snap').style.display = 'none';
  document.getElementById('btn-retake').style.display = 'none';
  document.getElementById('btn-stop-cam').style.display = 'none';
  document.getElementById('ocr-result').textContent = '';
}

async function readPlateWithAI(dataUrl) {
  const base64 = dataUrl.split(',')[1];
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 100,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
            { type: 'text', text: 'Extract the license plate text from this image. Respond with ONLY the plate text, no spaces, no explanation. If no plate is visible, respond with: NO_PLATE' }
          ]
        }]
      })
    });
    const data = await res.json();
    const plate = data.content?.[0]?.text?.trim().toUpperCase() || '';
    if (!plate || plate === 'NO_PLATE') {
      document.getElementById('ocr-result').textContent = '⚠️ No se detectó placa. Ingresa manualmente.';
    } else {
      document.getElementById('ocr-result').textContent = `Detectada: ${plate}`;
      document.getElementById('verify-input').value = plate;
    }
  } catch(e) {
    document.getElementById('ocr-result').textContent = '⚠️ Error al analizar. Ingresa manualmente.';
  }
}

// ── Regime ─────────────────────────────────────────────
let activeRegime = 1;

function selectRegime(num, el) {
  activeRegime = num;
  document.querySelectorAll('.regime-title').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const ind = document.getElementById('regime-indicator');
  if (ind) ind.textContent = 'RÉGIMEN ' + num;
  showToast('📍 Régimen ' + num + ' seleccionado');
}


renderResidents();
updateStats();
</script>
